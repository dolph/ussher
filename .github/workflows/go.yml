name: Go

on:
  push:
    tags:
      - v*
    branches:
    - main
    - master
  pull_request:
    branches:
    - main
    - master
  create:

permissions:
  contents: write
  pull-requests: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Find and lint shell scripts
      run: |
        set -euo pipefail
        # Lint every tracked .sh file, regardless of directory. `git ls-files`
        # keeps us scoped to tracked content and picks up newly added or
        # renamed scripts on the PR that introduces them.
        git ls-files -z -- '*.sh' | xargs -0 -r shellcheck --

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version-file: 'go.mod'

    - name: Build & Test
      run: ./build.sh

    - name: Generate checksum
      if: startsWith(github.ref, 'refs/tags/v')
      run: sha256sum ussher > ussher.sha256

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        body_path: README.md
        files: |
          ussher
          ussher.sha256
